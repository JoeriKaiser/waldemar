user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  types {
    text/markdown md;
  }

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_static on;
  gzip_types text/html text/css text/javascript application/json image/svg+xml text/markdown;

  brotli on;
  brotli_static on;
  brotli_comp_level 5;
  brotli_types text/html text/css text/javascript application/json image/svg+xml text/markdown;

  map $http_accept $prefers_markdown {
    default 0;
    "~*text/markdown" 1;
  }

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  access_log /dev/stdout;

  server {
    listen 8080;
    server_name _;

    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
      if ($prefers_markdown) {
        rewrite ^ /index.md last;
      }
      try_files /index.html =404;
    }

    location = /index.html {
      return 301 /;
    }

    location = /index.md {
      default_type text/markdown;
      charset utf-8;
    }

    location = /llms.txt {
      default_type text/markdown;
      charset utf-8;
      try_files /llms.txt /index.md =404;
    }

    location = /robots.txt {
      default_type text/plain;
      charset utf-8;
    }

    location = /sitemap.xml {
      default_type application/xml;
      charset utf-8;
    }

    location = /favicon.svg {
      default_type image/svg+xml;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    add_header Cache-Control "public, max-age=86400, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Vary "Accept" always;
    add_header Link '</index.md>; rel="alternate"; type="text/markdown", </sitemap.xml>; rel="sitemap"' always;
  }
}
